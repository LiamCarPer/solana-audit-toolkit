[package]
name = "parity"
version = "0.1.0"
edition = "2024"
description = "Differential/behavioral engine for Solana protocol hunts (sat companion)"
authors = ["Liam Carvajal"]
license = "MIT"
repository = "https://github.com/LiamCarPer/solana-audit-toolkit"

[[bin]]
name = "parity"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
